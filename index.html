<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetaScalp Link</title><link rel="stylesheet" href="style.css"></head><body><main><h1>MetaScalp Link</h1><p>Откройте MetaScalp и подключите нужные биржи. Подготовьте два отдельных стакана без связанной группы на одной вкладке.</p><div id="request"></div><button id="connect">Подключить / повторить</button><p id="status" role="status" aria-live="polite"></p><section id="setup" hidden><label>MetaScalp <select id="instance"></select></label><button id="load">Проверить стаканы и подключения</button><div id="choices"></div><button id="apply" hidden>Открыть Long и Short</button></section><p class="note">Ссылка передаёт только площадки и тикеры. Страница обращается к MetaScalp на этом компьютере; ордера и счета не используются.</p></main><script type="module" src="app.mjs"></script></body></html>
